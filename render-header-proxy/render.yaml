services:
  - type: web
    name: umpdl-header-proxy
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: PROXY_KEY
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: MAX_REDIRECTS
        value: "5"
      - key: TMDB_BEARER_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: "gemini-2.0-flash"
      - key: GEMINI_BASE_URL
        value: "https://generativelanguage.googleapis.com/v1beta"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: LEARNING_MIN_BLOCK_VOTES
        value: "3"
      - key: LEARNING_MAX_RULES
        value: "200"
      - key: LEARNING_RATE_LIMIT
        value: "40"
      - key: PUBLIC_BASE_URL
        value: "https://render-header-proxy.onrender.com"
